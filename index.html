<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="The personal portfolio of Mihir Balsara.">
  <title>Mihir Balsara</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="alternate icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="desktop">
    <div class="name">
      <div class="intro">
        <h1>Mihir Balsara</h1>
        <nav aria-label="Find Mihir online">
          <a class="mac-button" id="resume" href="resume.pdf" target="_blank" rel="noopener">Resume</a>
          <a class="mac-button" id="linkedin" href="https://www.linkedin.com/in/mbalsara/" target="_blank" rel="noopener">LinkedIn</a>
          <a class="mac-button" id="github" href="https://github.com/GlxryX/" target="_blank" rel="noopener">GitHub</a>
          <button class="mac-button" id="contact" type="button" aria-haspopup="dialog" aria-controls="contact-dialog">Contact</button>
        </nav>
      </div>
    </div>
    <footer>
      <div class="footer-meta">
        <p class="copyright">Copyright © <span id="copyright-year"></span> Mihir Balsara. All rights reserved.</p>
        <time id="clock" aria-label="Current local date and time"></time>
      </div>
    </footer>
  </main>
  <dialog id="contact-dialog" aria-labelledby="contact-title" aria-describedby="contact-description">
    <div class="contact-titlebar">
      <form method="dialog" class="window-controls">
        <button class="window-dot close-window" type="submit" aria-label="Close contact window"><span aria-hidden="true">×</span></button>
        <span class="window-dot minimize-window" aria-hidden="true"></span>
        <span class="window-dot zoom-window" aria-hidden="true"></span>
      </form>
      <h2 id="contact-title">Contact</h2>
    </div>
    <div class="contact-content">
      <p id="contact-description">Contact me at the email listed in my <a href="resume.pdf" target="_blank" rel="noopener">Resume</a>.</p>
    </div>
  </dialog>
</body>
</html>
